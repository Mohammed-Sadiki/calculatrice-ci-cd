
name: Pipeline CI/CD Calculatrice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # JOB 1 : Vérification du style du code
  lint:
    name: Lint (style du code)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Flake8
        run: python -m pip install flake8

      - name: Vérifier le style du code
        run: python -m flake8 . --max-line-length=100


  # JOB 2 : Tests automatiques
  test:
    name: Tests automatiques
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Installer Pytest
        run: python -m pip install pytest

      - name: Exécuter les tests
        run: python -m pytest -v


  # JOB 3 : Construction du paquet
  build:
    name: Construction du paquet
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer le dossier dist
        run: mkdir -p dist

      - name: Copier le fichier Python
        run: cp calculatrice.py dist/

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-paquet
          path: dist/


  # JOB 4 : Déploiement simulé
  deploy:
    name: Déploiement (simulé)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Télécharger l'artefact
        uses: actions/download-artifact@v4
        with:
          name: calculatrice-paquet
          path: dist/

      - name: Afficher les fichiers
        run: ls -l dist/

      - name: Simuler le déploiement
        run: echo "Application déployée avec succès !"
